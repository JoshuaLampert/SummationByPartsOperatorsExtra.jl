name: JET
on:
  push:
    branches:
      - main
    tags: ['*']
    paths-ignore:
      - 'CITATION.bib'
      - 'LICENSE.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - '.zenodo.json'
      - '.github/workflows/benchmark.yml'
      - '.github/workflows/CompatHelper.yml'
      - '.github/workflows/Documenter.yml'
      - '.github/workflows/Format-check.yml'
      - '.github/workflows/TagBot.yml'
      - '.github/workflows/SpellCheck.yml'
      - 'benchmark/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'CITATION.bib'
      - 'LICENSE.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - '.zenodo.json'
      - '.github/workflows/benchmark.yml'
      - '.github/workflows/CompatHelper.yml'
      - '.github/workflows/Documenter.yml'
      - '.github/workflows/Format-check.yml'
      - '.github/workflows/TagBot.yml'
      - '.github/workflows/SpellCheck.yml'
      - 'benchmark/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - run: julia -e 'using InteractiveUtils; versioninfo(verbose=true)'
      - uses: julia-actions/cache@v3
      - name: Install and run JET.jl
        shell: julia --project="." --color=yes {0}
        run: |
          using Pkg
          # The weak dependencies are added explicitly so that the package extensions
          # are loaded and can be analyzed by JET as well.
          Pkg.add(["JET", "ForwardDiff", "Makie", "Manifolds", "Manopt", "Meshes",
                   "Optim", "RecursiveArrayTools"])
          Pkg.instantiate()
          using JET
          using ForwardDiff, Makie, Manifolds, Manopt, Meshes, Optim, RecursiveArrayTools
          using SummationByPartsOperatorsExtra

          test_package(SummationByPartsOperatorsExtra;
                       target_modules = (SummationByPartsOperatorsExtra,))

          # Most of the code of this package lives in the extensions, so analyze them, too.
          for name in (:ManifoldsManoptForwardDiffExt, :MeshesExt, :MeshesMakieExt,
                       :OptimForwardDiffExt)
              ext = Base.get_extension(SummationByPartsOperatorsExtra, name)
              # Guard against silently skipping an extension that failed to load
              ext === nothing && error("extension $name is not loaded")
              @info "Analyzing $name"
              test_package(ext; target_modules = (ext,))
          end
